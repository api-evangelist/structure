name: Structure
description: 'Structure (Structure Financial Inc.) is a Web3 platform for designing, backtesting,
  and deploying fully automated, permissionless crypto trading strategies without writing code.
  Its visual strategy editor and AI-assisted code generation let users build algorithmic strategies
  that compile to Rust and deploy non-custodially to decentralized exchanges including Hyperliquid,
  Drift, and Jupiter; strategies receive trading-only permissions so funds never leave the user''s
  vault. The company documents live, paper, and backtest execution paths and references MCP-agent
  and code-based access alongside its no-code visual interface. Founded by MIT and Jump Trading
  alumni and backed by the investors behind Coinbase and Solana.'
